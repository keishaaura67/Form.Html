<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Registrasi</title>
  </head>

  <body>
    <h2>Form Registrasi</h2>
    <form action="" method="post" enctype="multipart/form-data">
      <fieldset>
        <legend>Biodata</legend>
        <table cellpadding="2">
          <tr>
            <td>Nama Mahasiswa</td>
            <td>:</td>
            <td><input type="text" name="nama" placeholder="Nama Anda" size="20" /></td>
          </tr>
          <tr>
            <td>No Induk Mahasiswa (NIM)</td>
            <td>:</td>
            <td><input type="text" name="nim" value="123456789" size="20" /></td>
          </tr>
          <tr valign="top">
            <td>Alamat Mahasiswa</td>
            <td>:</td>
            <td><textarea name="alamat" cols="30" rows="4" placeholder="Alamat Anda"></textarea></td>
          </tr>
          <tr>
            <td>Tanggal Lahir</td>
            <td>:</td>
            <td>
              <select name="tanggal">
                <option value="01">01</option>
                <option value="02">02</option>
                <option value="03">03</option>
              </select>
              <select name="bulan">
                <option value="Januari">Januari</option>
                <option value="Februari">Februari</option>
                <option value="Maret">Maret</option>
              </select>
              <select name="tahun">
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Jenis Kelamin</td>
            <td>:</td>
            <td>
              <input type="radio" id="pria" name="jenis_kelamin" value="Pria" checked />
              <label for="pria">Pria</label>
              <input type="radio" id="wanita" name="jenis_kelamin" value="Wanita" />
              <label for="wanita">Wanita</label>
            </td>
          </tr>
          <tr>
            <td>Upload Foto</td>
            <td>:</td>
            <td><input type="file" name="foto" /></td>
          </tr>
          <tr>
            <td>URL Website</td>
            <td>:</td>
            <td><input type="url" name="url" placeholder="URL Website Anda" size="30" /></td>
          </tr>
          <tr>
            <td>Perguruan Tinggi</td>
            <td>:</td>
            <td><input type="text" name="perguruan_tinggi" size="20" /></td>
          </tr>
        </table>
      </fieldset>

      <br />

      <fieldset>
        <legend>Info Akun</legend>
        <table cellpadding="2">
          <tr>
            <td>Email</td>
            <td>:</td>
            <td><input type="email" name="email" placeholder="Email Anda" size="20" /></td>
          </tr>
          <tr>
            <td>Username</td>
            <td>:</td>
            <td><input type="text" name="username" placeholder="Username Anda" size="20" /></td>
          </tr>
          <tr>
            <td>Password</td>
            <td>:</td>
            <td><input type="password" name="password" placeholder="Password Anda" size="20" /></td>
          </tr>
          <tr>
            <td>Ulangi Password</td>
            <td>:</td>
            <td><input type="password" name="ulangi_password" placeholder="Password Anda" size="20" /></td>
          </tr>
        </table>
      </fieldset>

      <br />

      <fieldset>
        <legend>Kemampuan Dasar</legend>

        <input type="checkbox" id="html" name="kemampuan[]" value="HTML" />
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="kemampuan[]" value="CSS" />
        <label for="css">CSS</label>
        <input type="checkbox" id="javascript" name="kemampuan[]" value="Javascript" />
        <label for="javascript">Javascript</label>
        <input type="checkbox" id="php" name="kemampuan[]" value="PHP" />
        <label for="php">PHP</label>
        <input type="checkbox" id="mysql" name="kemampuan[]" value="MySQL" />
        <label for="mysql">MySQL</label>
        <input type="checkbox" id="laravel" name="kemampuan[]" value="Laravel" />
        <label for="laravel">Laravel</label>
        <input type="checkbox" id="react-native" name="kemampuan[]" value="React Native" />
        <label for="react-native">React Native</label>
      </fieldset>

      <br />
    
      <input type="reset" value="Reset" />
      <input type="submit" value="Simpan" />
      <input type="button" value="Button" />
    </form>
  </body>
</html>
